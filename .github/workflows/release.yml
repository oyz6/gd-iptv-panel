name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gd-iptv-panel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p /tmp/pack/gd-iptv-panel
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='app/data/output' \
            --exclude='app/data/config.json' \
            --exclude='app/data/health_samples.json' \
            --exclude='__pycache__' \
            ./ /tmp/pack/gd-iptv-panel/
          cd /tmp/pack
          zip -r gd-iptv-panel-${TAG}.zip gd-iptv-panel
          tar -czf gd-iptv-panel-${TAG}.tar.gz gd-iptv-panel
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            /tmp/pack/gd-iptv-panel-${{ env.TAG }}.zip
            /tmp/pack/gd-iptv-panel-${{ env.TAG }}.tar.gz
          body: |
            ## gd-iptv-panel ${{ env.TAG }}

            Docker 镜像：
