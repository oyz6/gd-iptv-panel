name: 📌 生成并提交 Cargo.lock

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - '.github/workflows/lockfile.yml'
  schedule:
    - cron: '0 3 * * 0'

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lockfile:
    name: 生成 Cargo.lock
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 缓存 cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lockfile-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            lockfile-${{ runner.os }}-

      - name: 生成 / 更新 Cargo.lock
        run: cargo generate-lockfile

      # 关键修复：先 add，再判断。这样无论是“新建”还是“修改”都会被 git 感知。
      - name: 暂存 Cargo.lock
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "❌ cargo generate-lockfile 没生成 Cargo.lock，检查 Cargo.toml"
            exit 1
          fi
          git add Cargo.lock

      - name: 检查是否有变化
        id: diff
        run: |
          # --cached：比较暂存区与 HEAD，能同时覆盖“新增”和“修改”两种情况
          if git diff --cached --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Cargo.lock 无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 Cargo.lock 有变化："
            git --no-pager diff --cached --stat -- Cargo.lock
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): 更新 Cargo.lock [skip ci]"
          git push
